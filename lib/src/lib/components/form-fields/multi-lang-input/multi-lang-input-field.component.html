@if (!fieldIsHidden()) {
  <div
    [formGroup]="_group()"
    class="lab900-multi-lang-field lab900-multi-lang-field--{{ setting?.formField?.appearance || 'standard' }}"
    id="lab900-multi-lang-field-{{ elementId() }}"
    style="padding-bottom: 1.34375em">
    <lab900-multi-lang-field-control
      [formControlName]="_fieldAttribute()"
      [defaultLanguage]="language()"
      [availableLanguages]="availableLanguages()"
      [required]="fieldIsRequired()"
      [readonly]="fieldIsReadonly()"
      [label]="label()"
      [buttonColor]="$safeNavigationMigration(_options()?.buttonColor)"
      [translateLabel]="$safeNavigationMigration(_options()?.translateLabel)"
      [stopTranslateLabel]="$safeNavigationMigration(_options()?.stopTranslateLabel)"
      [useTextAreaField]="$safeNavigationMigration(_options()?.useTextAreaField)" />
    @if (!valid && touched && !fieldIsReadonly()) {
      <div>
        <mat-error>{{ errorMessage() }}</mat-error>
      </div>
    }
  </div>
}
