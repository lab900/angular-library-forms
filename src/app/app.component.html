<div class="lab900-showcase">
  <mat-toolbar class="lab900-showcase__header">
    <div>
      <div>
        <div class="menu-button">
          <button (click)="drawer?.toggle()" mat-icon-button>
            <mat-icon>menu</mat-icon>
          </button>
        </div>
        <a [routerLink]="['/']" class="lab900-showcase__header__logo">
          <img
            [ngSrc]="'assets/images/logo-dark-white.svg'"
            [priority]="true"
            alt="{{ 'app.title' | translate }}"
            width="44"
            height="38" />
          <h1>{{ 'app.title' | translate }}</h1>
        </a>
      </div>
      <div>
        <a style="display: block" href="{{ gitUrl }}" target="_blank" mat-icon-button>
          <mat-icon svgIcon="github" />
        </a>
      </div>
    </div>
  </mat-toolbar>
  <div class="lab900-showcase__content">
    <mat-drawer-container class="example-container">
      <mat-drawer #drawer [mode]="(sideNavMode$ | async) ?? 'side'" opened>
        <lab900-nav-list [navItemGroups]="navItemsGroups" [showLevelArrows]="true" />
      </mat-drawer>
      <mat-drawer-content>
        <main>
          <router-outlet />
        </main>
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
