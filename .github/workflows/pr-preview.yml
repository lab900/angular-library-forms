# Deploys the showcase of every pull request to gh-pages under pr-preview/pr-<number>/
# and removes it again when the pull request closes.
# The main showcase deploy (`npm run deploy:showcase`) uses `add: true`, so it keeps these folders.
name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    # Pull requests from forks get a read-only token and cannot push to gh-pages.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build showcase
        if: github.event.action != 'closed'
        run: npm run build -- --base-href /angular-library-forms/pr-preview/pr-${{ github.event.number }}/

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist/angular-library-forms/browser
          preview-branch: gh-pages
          umbrella-dir: pr-preview
